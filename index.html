<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Tracker</title>
<link rel="stylesheet" href="template/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Personal Finance Tracker</h1>
           <div class="summary">
    <div class="total-amount">
        <span>Total: </span>
        <span id="total-amount" contenteditable="true">0.00</span> MAD
    </div>
    <div class="savings">
        <span>Savings: </span>
        <span id="savings-amount" contenteditable="true">0.00</span> MAD
    </div>
    <div class="project-savings">
        <span>Project: </span>
        <span id="project-amount" contenteditable="true">0.00</span> MAD
    </div>
</div>
        </header>

        <main>
            <section class="calendar-section">
                <h2>Expense Calendar</h2>
                <div class="calendar-controls">
    <button id="prev-month">Previous</button>
    <span id="current-month">Month Year</span>
    <button id="next-month">Next</button>
</div>
<div class="monthly-budget">
    <span>Monthly Budget: </span>
    <span id="monthly-budget-amount">0.00</span> MAD
    <button id="edit-budget">Edit</button>
</div>
                <div id="calendar" class="calendar">
                    <!-- Calendar will be generated by JavaScript -->
                </div>
            </section>

            <section class="wallet-section">
                <h2>Wallet Manager</h2>
                <div class="wallet-container">
                    <table id="wallet-table">
                        <thead>
                            <tr>
                                <th>Bill</th>
                                <th>200</th>
                                <th>100</th>
                                <th>50</th>
                                <th>20</th>
                                <th>10</th>
                                <th>5</th>
                                <th>2</th>
                                <th>1</th>
                                <th>0.5</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>At Home</td>
                                <td><input type="number" class="bill-input" data-bill="200" data-type="home" min="0"></td>
                                <!-- Other bill inputs will be added by JavaScript -->
                            </tr>
                            <tr>
                                <td>In Wallet</td>
                                <td><input type="number" class="bill-input" data-bill="200" data-type="wallet" min="0"></td>
                                <!-- Other bill inputs will be added by JavaScript -->
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
